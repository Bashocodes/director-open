name: Bug report
description: Report a reproducible problem in Director Open
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Director Open. Do not include API keys,
        private media, personal paths, or other sensitive data.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
      placeholder: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic or non-sensitive media when media is needed.
      placeholder: |
        1. Open …
        2. Add …
        3. Observe …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.3.1 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Firefox 128 on Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Timeline or project editing
        - Media import or persistence
        - Preview or effects
        - Export or export verification
        - AI provider or proposed actions
        - Plugin system
        - Development tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant diagnostics
      description: Paste minimal redacted output. Never paste credentials.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched for an existing issue describing this problem.
          required: true
        - label: I removed keys, private media, personal paths, and private URLs.
          required: true
        - label: This is not a publicly disclosed security vulnerability.
          required: true
